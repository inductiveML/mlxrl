# Experimental CONF warm start. Toggle confidence.enabled for a matched baseline.
# Arithmetic example; RAMP's reported ~2x speedup is not established on MLX.
model_id = "mlx-community/Qwen3-0.6B-4bit"
quant_bits = 4
group_size = 4
groups_per_step = 4
prompt_format = "arithmetic_steps"
max_prompt_len = 512
max_completion_len = 128
steps = 16
seed = 7
kl_beta = 0.0
micro_batch_size = 2
output = "reference_outputs/confidence.npz"

[optimizer]
learning_rate = 0.00001

[sampling]
temperature = 1.0
top_p = 1.0

[algorithm]
name = "grpo"
grpo_loss_reduction = "sequence_mean"

[confidence]
enabled = true
warmup_updates = 8
target_share = 0.875
p99_cap = 10.0
min_mixed_groups = 4
extractor = "arithmetic"
