# Experimental single-turn score centering. Existing configs remain unchanged.
model_id = "mlx-community/Qwen3-0.6B-4bit"
quant_bits = 4
group_size = 4
max_completion_len = 64
max_prompt_len = 4096
steps = 20
seed = 7
kl_beta = 0.0
rank = 8
scale = 20.0
dropout = 0.0
output = "reference_outputs/score_centering.npz"

[optimizer]
name = "adam"
learning_rate = 0.00001

[sampling]
temperature = 0.7
top_p = 0.95

[algorithm]
name = "score-centering"
score_centering_top_k = 128
